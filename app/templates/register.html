{% extends "base.html" %}
{% block title %}Register — Go-Tone Games{% endblock %}

{% block content %}
<div class="auth">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="sub">Start playing Go-Tone games today</p>
    <form onsubmit="handleRegister(event)">
      <div class="fg">
        <label>Name</label>
        <input class="fi" id="name" required placeholder="Your name" />
      </div>
      <div class="fg">
        <label>Email</label>
        <input class="fi" type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="fg">
        <label>Password (min 6 chars)</label>
        <input class="fi" type="password" id="password" required minlength="6" />
      </div>
      <button class="btn btn-primary" style="width:100%; justify-content:center;" type="submit">Create Account</button>
    </form>
    <p style="text-align:center; margin-top:1.5rem; font-size:0.85rem;">
      Already have an account? <a href="/login">Login</a>
    </p>
  </div>
</div>

<script>
async function handleRegister(e) {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const res = await api('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify({ name, email, password }),
    });
    localStorage.setItem('gtoken', res.access_token);
    tok = res.access_token;
    updateNav();
    toast(`Welcome to Go-Tone, ${name}!`);
    location.href = '/';
  } catch(err) {
    toast('Registration failed: ' + err.message, 'error');
  }
}
</script>
{% endblock %}
