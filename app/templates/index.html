{% extends "base.html" %}
{% block title %}Home — Go-Tone Games{% endblock %}

{% block content %}
<div class="container-wide">
  <!-- Hero -->
  <div style="text-align:center; padding: 4rem 0 3rem;">
    <h1 style="font-size:3rem; font-weight:900; letter-spacing:-0.03em; line-height:1.1;">
      Workout Games<br><span style="color:var(--accent)">That Fight Back</span>
    </h1>
    <p style="color:var(--ink-dim); max-width:560px; margin:1rem auto 2rem; font-size:1.1rem;">
      Connect your Go-Tone smart resistance device and play games that adapt to your strength in real-time.
    </p>
    <a href="/games" class="btn btn-primary" style="font-size:1rem; padding:0.75rem 2rem;">
      Browse Games &rarr;
    </a>
  </div>

  <!-- Game cards -->
  <div class="section-header">
    <h2>Featured Games</h2>
    <a href="/games" style="color:var(--accent); font-size:0.9rem;">View all &rarr;</a>
  </div>
  <div class="card-grid" id="featured-grid">
    <!-- Filled by JS from API -->
  </div>
</div>

<script>
async function loadFeatured() {
  const res = await api('/api/games');
  const grid = document.getElementById('featured-grid');
  grid.innerHTML = res.slice(0, 4).map(game => `
    <div class="game-card" onclick="location.href='/game/${game.slug}'">
      <div class="game-card-cover">
        🎮
        <span class="badge ${game.is_premium ? 'badge-free' : 'badge-premium'}">
          ${game.price === 0 ? 'FREE' : '$' + game.price}
        </span>
      </div>
      <div class="game-card-body">
        <div class="title">${game.title}</div>
        <div class="desc">${game.description.substring(0, 100)}...</div>
        <div class="meta">
          <span class="chip chip-accent">${game.category}</span>
          <span>${'⭐'.repeat(game.difficulty) || '⭐'}</span>
        </div>
      </div>
    </div>
  `).join('');
}
loadFeatured();
</script>
{% endblock %}
