{% extends "base.html" %}
{% block title %}My Library — Go-Tone Games{% endblock %}

{% block content %}
<div class="container-wide">
  <div class="section-header">
    <h1>My Library</h1>
    <button class="btn" onclick="loadLibrary()">↻ Refresh</button>
  </div>

  <div id="library-content">
    <p style="color:var(--ink-dim);">Loading your library...</p>
  </div>
</div>

<script>
async function loadLibrary() {
  const el = document.getElementById('library-content');
  try {
    const data = await api('/api/library');
    const all = [...(data.owned || []), ...(data.free || [])];
    if (!all.length) {
      el.innerHTML = `<p style="color:var(--ink-dim);">Your library is empty. <a href="/library">Browse all games</a> to find your first game!</p>`;
      return;
    }

    el.innerHTML = `
      <div class="card-grid">
        ${all.map(g => `
          <div class="game-card" onclick="location.href='/game/${g.slug}'">
            <div class="game-card-cover ${g.category || ''}">
              🎮
              <div class="play-overlay" onclick="event.stopPropagation(); playGame('${g.slug}', '${g.title}')">▶</div>
            </div>
            <div class="game-card-body">
              <div class="title">${g.title}</div>
              <div class="desc">${g.description.substring(0, 100)}${g.description.length > 100 ? '...' : ''}</div>
              <div class="meta">
                <span class="chip chip-accent">${g.category || 'workout'}</span>
                <span>${'⭐'.repeat(g.difficulty)}</span>
              </div>
              <button class="btn btn-primary btn-sm" style="margin-top:0.65rem; width:100%;" onclick="event.stopPropagation(); playGame('${g.slug}', '${g.title}')">▶ Play Now</button>
            </div>
          </div>
        `).join('')}
      </div>`;
  } catch(err) {
    el.innerHTML = '<p style="color:var(--danger);">Error loading library. Please login.</p>';
  }
}

function playGame(slug, title) {
  toast(`Launching ${title}... connect your Go-Tone device!`, 'success');
}

loadLibrary();
</script>
{% endblock %}
