{% extends "base.html" %}
{% block title %}Leaderboard — {{ slug }}{% endblock %}

{% block content %}
<div class="container">
  <a href="/game/{{ slug }}" style="color:var(--ink-dim); font-size:0.85rem; margin-bottom:1.5rem; display:inline-block;">← Back to {{ slug }}</a>

  <div class="section-header">
    <h1>Leaderboard — {{ slug|replace('-', ' ')|title }}</h1>
  </div>

  <table class="lb-table" id="leaderboard-table">
    <thead>
      <tr><th>Rank</th><th>Player</th><th>Score</th><th>Reps</th><th>Meters</th><th>Date</th></tr>
    </thead>
    <tbody>
      <tr><td colspan="6" style="text-align:center; color:var(--ink-dim);">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
const slug = "{{ slug }}";

async function loadLeaderboard() {
  const res = await api(`/api/leaderboard/${slug}`);
  const tbody = document.querySelector('#leaderboard-table tbody');

  if (!res.leaderboard?.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--ink-dim);">No scores yet. Be the first!</td></tr>';
    return;
  }

  tbody.innerHTML = res.leaderboard.map((s, i) => `
    <tr>
      <td class="rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i+1}</td>
      <td>${s.name || s.user_id || 'Anonymous'} <span class="chip" style="font-size:0.6rem;">${s.tier}</span></td>
      <td class="score">${s.score.toLocaleString()}</td>
      <td class="score">${s.reps}</td>
      <td>${(s.meters || 0).toFixed(1)}m</td>
      <td style="color:var(--ink-dim); font-size:0.8rem;">${new Date(s.created_at).toLocaleDateString()}</td>
    </tr>
  `).join('');
}

loadLeaderboard();
</script>
{% endblock %}
