/* Base template - clean, Netflix-style game library */
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Go-Tone Games{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f1a;
      --bg-2: #111827;
      --ink: #e2e8f0;
      --ink-dim: #64748b;
      --line: #1e293b;
      --accent: #22d3ee;
      --accent-glow: rgba(34, 211, 238, 0.12);
      --success: #34d399;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }

    /* Navbar */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11, 15, 26, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      height: 56px;
    }
    .nav-inner {
      max-width: 1440px; margin: 0 auto; padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 100%;
    }
    .brand {
      font-weight: 800; font-size: 1.15rem; color: var(--accent);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .brand .logo {
      width: 28px; height: 28px; background: var(--accent);
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      color: var(--bg); font-weight: 900; font-size: 0.75rem;
    }
    .nav { display: flex; gap: 1.5rem; align-items: center; }
    .nav a {
      color: var(--ink-dim); font-weight: 600; font-size: 0.85rem;
      transition: color 0.15s;
    }
    .nav a:hover, .nav a.active { color: var(--ink); }
    .badge {
      background: var(--bg-2); border: 1px solid var(--line);
      border-radius: 99px; padding: 0.25rem 0.75rem;
      font-size: 0.75rem; color: var(--ink-dim);
      display: flex; align-items: center; gap: 0.3rem;
    }
    .badge .dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; }

    /* Cards - Netflix style: big art, minimal text */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.75rem;
    }
    .card {
      background: var(--bg-2);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .card-img {
      height: 300px;
      background: var(--accent-glow);
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem;
      position: relative;
    }
    .card-img::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(17,24,39,0.95) 0%, transparent 50%);
    }
    .card-play {
      position: absolute;
      bottom: 12px; left: 12px; z-index: 2;
      background: rgba(34,211,238,0.95);
      border-radius: 99px;
      padding: 0.4rem 0.9rem;
      font-size: 0.72rem; font-weight: 700; color: var(--bg);
      opacity: 0; transition: opacity 0.2s;
      pointer-events: none;
    }
    .card:hover .card-play { opacity: 1; }
    .card-name {
      padding: 0.8rem 0.9rem 0.9rem;
      font-size: 0.9rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.3rem; border-radius: 8px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
      border: 1px solid var(--line); background: var(--bg-2);
      color: var(--ink); transition: all 0.15s; font-family: inherit;
    }
    .btn:hover { border-color: var(--line); background: var(--ink-dim); color: var(--bg); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn-primary:hover { filter: brightness(1.12); }
    .btn-lg { padding: 0.75rem 2rem; font-size: 0.95rem; }
    .btn-sm { padding: 0.4rem 1rem; font-size: 0.78rem; }

    /* Hero - subscription messaging */
    .hero { text-align: center; padding: 4rem 0 3rem; }
    .hero h1 {
      font-size: 3.5rem; font-weight: 900; line-height: 1.05; margin-bottom: 0.75rem;
    }
    .hero h1 span { color: var(--accent); }
    .hero p {
      color: var(--ink-dim); font-size: 1.05rem;
      max-width: 460px; margin: 0 auto 2rem; line-height: 1.6;
    }
    .hero-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

    /* Section */
    .container { max-width: 1440px; margin: 0 auto; padding: 0 2rem 3rem; }
    .sec { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem; }
    .sec h2 { font-size: 1.2rem; font-weight: 800; }
    .sec a { font-size: 0.85rem; }

    /* Filters */
    .filters { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .filt {
      padding: 0.3rem 0.9rem; border-radius: 99px;
      font-size: 0.78rem; font-weight: 600;
      background: transparent; border: 1px solid var(--line);
      color: var(--ink-dim); cursor: pointer; transition: all 0.15s;
      font-family: inherit;
    }
    .filt:hover { border-color: var(--ink-dim); color: var(--ink); }
    .filt.on { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }

    /* Detail page */
    .detail {
      max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem;
      display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;
    }
    .detail-art {
      height: 380px; background: var(--accent-glow); border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center; font-size: 5rem;
    }
    .info h1 { font-size: 2.5rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1.08; }
    .info p { color: var(--ink-dim); font-size: 0.95rem; margin-top: 1rem; line-height: 1.6; max-width: 420px; }
    .specs { display: flex; gap: 0.75rem; margin-top: 2rem; flex-wrap: wrap; }
    .sp { background: var(--bg-2); border-radius: 8px; padding: 0.75rem 1rem; flex: 1; min-width: 100px; }
    .sp-l { font-size: 0.65rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.04em; }
    .sp-v { font-size: 1.1rem; font-weight: 700; margin-top: 0.15rem; }
    .actions { margin-top: 1.5rem; }
    .back { color: var(--ink-dim); font-size: 0.85rem; margin-bottom: 1.5rem; display: inline-block; font-weight: 600; }
    .back:hover { color: var(--ink); }

    /* Pricing */
    .pricing { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; max-width: 900px; margin: 2rem auto; }
    .pc {
      background: var(--bg-2); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 2rem; text-align: center; transition: border-color 0.2s;
    }
    .pc:hover { border-color: var(--accent); }
    .pc.feat { border-color: var(--accent); position: relative; }
    .pc.feat::before {
      content: 'BEST VALUE'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: var(--bg); padding: 0.15rem 0.8rem;
      border-radius: 99px; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.04em;
    }
    .pc h3 { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--ink-dim); letter-spacing: 0.04em; }
    .pr { font-size: 2.5rem; font-weight: 900; color: var(--accent); margin-top: 0.75rem; }
    .pr span { font-size: 1rem; color: var(--ink-dim); font-weight: 500; }
    .pc ul { list-style: none; margin: 1.25rem 0; text-align: left; }
    .pc li { padding: 0.25rem 0; color: var(--ink-dim); font-size: 0.85rem; }
    .pc li::before { content: '✓ '; color: var(--success); font-weight: 700; }

    /* Leaderboard */
    .lb { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .lb th { text-align: left; padding: 0.5rem 1rem; border-bottom: 2px solid var(--line); color: var(--ink-dim); font-size: 0.68rem; text-transform: uppercase; }
    .lb td { padding: 0.6rem 1rem; border-bottom: 1px solid var(--line); }
    .lb tr:hover td { background: var(--bg-2); }
    .lb .rank { font-weight: 800; color: var(--accent); width: 40px; }
    .lb .score { font-weight: 700; color: var(--success); }

    /* Reviews */
    .rv { background: var(--bg-2); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 0.5rem; }
    .rv .author { font-weight: 600; font-size: 0.85rem; }
    .rv .text { color: var(--ink-dim); font-size: 0.85rem; margin-top: 0.25rem; }
    .rv .date { color: var(--ink-dim); font-size: 0.7rem; margin-top: 0.35rem; }
    .rv .stars { color: #fbbf24; font-size: 0.8rem; }

    /* Auth */
    .auth { min-height: calc(100vh - 56px); display: flex; align-items: center; justify-content: center; }
    .auth-card { width: 100%; max-width: 380px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 2rem; }
    .auth-card h1 { text-align: center; font-size: 1.5rem; margin-bottom: 0.25rem; }
    .auth-card .sub { text-align: center; color: var(--ink-dim); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .fg { margin-bottom: 1rem; }
    .fg label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--ink-dim); margin-bottom: 0.3rem; }
    .fi { width: 100%; padding: 0.6rem 0.85rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-family: inherit; font-size: 0.9rem; }
    .fi:focus { outline: none; border-color: var(--accent); }
    textarea.fi { resize: vertical; min-height: 80px; }

    /* Toast */
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999; padding: 0.75rem 1.25rem; border-radius: 8px; font-size: 0.85rem; font-weight: 500; animation: t-in 0.3s ease; border: 1px solid; }
    .toast-success { background: #064e3b; border-color: var(--success); color: var(--success); }
    .toast-error { background: #7f1d1d; border-color: #b91c1c; color: #f87171; }
    @keyframes t-in { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Footer */
    .foot { border-top: 1px solid var(--line); padding: 1.5rem 2rem; text-align: center; color: var(--ink-dim); font-size: 0.75rem; margin-top: 2rem; }

    @media (max-width: 768px) {
      .detail { grid-template-columns: 1fr; }
      .hero h1 { font-size: 2.25rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
      .card-img { height: 220px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="brand">
        <span class="logo">GT</span>
        Go-Tone
      </a>
      <div class="nav">
        <a href="/">Play</a>
        <a href="/library">Library</a>
        <a href="/leaderboard/all">Leaderboard</a>
        <a href="/login" id="nav-login">Sign In</a>
        <a href="#" id="nav-logout" style="display:none">Logout</a>
        <span id="nav-user" class="badge" style="display:none">
          <span class="dot"></span>
          <span id="nav-username"></span>
        </span>
      </div>
    </div>
  </nav>

  <script>
    const qs = new URLSearchParams(location.search);
    let tok = localStorage.getItem('gtoken') || qs.get('token');

    function updateNav() {
      const login = document.getElementById('nav-login');
      const logout = document.getElementById('nav-logout');
      const badge = document.getElementById('nav-user');
      const name = document.getElementById('nav-username');
      if (tok) {
        login.style.display = 'none';
        logout.style.display = 'inline';
        badge.style.display = 'flex';
        try {
          const p = JSON.parse(atob(tok.split('.')[1]));
          name.textContent = (p.email || 'Guest').split('@')[0];
        } catch(e) { name.textContent = 'Guest'; }
        return;
      }
      login.style.display = 'inline';
      logout.style.display = 'none';
      badge.style.display = 'none';
    }

    document.getElementById('nav-logout')?.addEventListener('click', (e) => {
      e.preventDefault();
      tok = null;
      localStorage.removeItem('gtoken');
      updateNav();
      location.href = '/';
    });

    async function api(path, opts = {}) {
      const h = { 'Content-Type': 'application/json' };
      if (tok) h['Authorization'] = `Bearer ${tok}`;
      const r = await fetch(path, { ...opts, headers: { ...h, ...(opts.headers||{}) } });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || 'Error');
      return d;
    }

    function toast(msg, type='success') {
      const ex = document.querySelector('.toast'); if (ex) ex.remove();
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    updateNav();
  </script>

  {% block content %}{% endblock %}

  <footer class="foot">
    <p>Go-Tone Games &copy; 2025</p>
  </footer>
</body>
</html>
