{% extends "base.html" %}
{% block title %}Login — Go-Tone Games{% endblock %}

{% block content %}
<div class="auth">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="sub">Login to access your games</p>
    <form onsubmit="handleLogin(event)">
      <div class="fg">
        <label>Email</label>
        <input class="fi" id="email" type="email" required placeholder="you@example.com" />
      </div>
      <div class="fg">
        <label>Password</label>
        <input class="fi" type="password" id="password" required />
      </div>
      <button class="btn btn-primary" style="width:100%; justify-content:center;" type="submit">Login</button>
    </form>
    <p style="text-align:center; margin-top:1.5rem; font-size:0.85rem;">
      Don't have an account? <a href="/register">Register</a>
    </p>
  </div>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const res = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email, password }),
    });
    localStorage.setItem('gtoken', res.access_token);
    tok = res.access_token;
    updateNav();
    toast(`Welcome back, ${res.user.name}!`);
    location.href = '/';
  } catch(err) {
    toast('Invalid email or password', 'error');
  }
}
</script>
{% endblock %}
