{% extends "base.html" %}
{% block title %}Library — Go-Tone Games{% endblock %}

{% block content %}
<div class="container-wide">
  <div class="section-header">
    <h1>Your Library</h1>
    <span style="color:var(--ink-dim); font-size:0.9rem;" id="game-count">Loading...</span>
  </div>

  <!-- Filters -->
  <div class="filter-bar" id="filters">
    <span class="chip active" data-cat="all">All Games</span>
    <span class="chip" data-cat="strength">💪 Strength</span>
    <span class="chip" data-cat="cardio">🏃 Cardio</span>
    <span class="chip" data-cat="flexibility">🧘 Flexibility</span>
    <span class="chip" data-cat="full_body">🔥 Full Body</span>
  </div>

  <!-- Grid -->
  <div class="card-grid" id="game-grid">
    <!-- Filled by JS -->
  </div>
</div>

<script>
const grid = document.getElementById('game-grid');
const countEl = document.getElementById('game-count');
let currentFilter = 'all';

async function loadGames(category = 'all') {
  const params = new URLSearchParams({ category });

  const res = await api(`/api/games?${params}`);
  grid.innerHTML = '';
  countEl.textContent = `${res.length} games in library`;

  res.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.onclick = () => location.href = `/game/${game.slug}`;
    card.innerHTML = `
      <div class="game-card-cover">
        🎮
        <div class="play-overlay" onclick="event.stopPropagation(); playGame('${game.slug}', '${game.title}')">▶</div>
      </div>
      <div class="game-card-body">
        <div class="title">${game.title}</div>
        <div class="desc">${game.description.substring(0, 120)}${game.description.length > 120 ? '..' : ''}</div>
        <div class="meta">
          <span class="chip chip-accent">${game.category}</span>
          <span>${'⭐'.repeat(game.difficulty) || '⭐'}</span>
          <span class="chip">${game.min_weight}-${game.max_weight}lb</span>
        </div>
        <button class="btn btn-primary btn-sm" style="margin-top:0.75rem; width:100%;" onclick="event.stopPropagation(); playGame('${game.slug}', '${game.title}')">▶ Play Now</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

loadGames('all');

// Filter clicks
document.getElementById('filters').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;

  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');

  const cat = chip.dataset.cat;
  loadGames(cat === 'all' ? 'all' : cat);
});

function playGame(slug, title) {
  showToast(`Launching ${title}... connect your Go-Tone device!`, 'success');
}
</script>
{% endblock %}
