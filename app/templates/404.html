<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Go-Tone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f13;
            color: #e0e0e6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }
        .error-code {
            font-size: 7rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #6366f1, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .error-sub {
            font-size: 1.25rem;
            color: #9ca3af;
            margin-bottom: 2.5rem;
        }
        .btn-home {
            display: inline-block;
            padding: 12px 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        .btn-home:hover { opacity: 0.85; }
        .error-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">🎮</div>
        <div class="error-code">404</div>
        <p class="error-sub">This level hasn't loaded yet.<br><a href="/" style="color:#a78bfa;text-decoration:underline;">Head back to the store</a> instead.</p>
        <a href="/" class="btn-home">Back to Go-Tone</a>
    </div>
</body>
</html>
