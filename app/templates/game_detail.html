{% extends "base.html" %}
{% block title %}{{ slug }} — Go-Tone Games{% endblock %}

{% block content %}
<div class="container">
  <a href="/library" style="color:var(--ink-dim); font-size:0.85rem; margin-bottom:1.5rem; display:inline-block; transition: color 0.15s;" onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--ink-dim)'">← Back to Library</a>

  <div class="game-hero">
    <div class="game-hero-visual" id="game-visual">🎮</div>
    <div class="game-info" id="game-info">
      <!-- Loaded via JS -->
    </div>
  </div>

  <!-- Reviews -->
  <div style="margin-top:2.5rem;">
    <div class="section-header">
      <h2>Reviews</h2>
      <span style="color:var(--ink-dim); font-size:0.85rem;" id="review-count"></span>
    </div>
    <div id="reviews-list">
      <p style="color:var(--ink-dim);">Loading...</p>
    </div>
    <!-- Write review -->
    <div id="review-form" style="display:none; margin-top:1.5rem; max-width:520px;">
      <div class="fg">
        <label>Your Rating</label>
        <select class="fi" id="rating">
          <option value="5">⭐⭐⭐⭐⭐ (5)</option>
          <option value="4">⭐⭐⭐⭐ (4)</option>
          <option value="3">⭐⭐⭐ (3)</option>
          <option value="2">⭐⭐ (2)</option>
          <option value="1">⭐ (1)</option>
        </select>
      </div>
      <div class="fg">
        <label>Comment</label>
        <textarea class="fi" id="comment" placeholder="What did you think?" rows="3"></textarea>
      </div>
      <button class="btn btn-primary" onclick="submitReview()">Submit Review</button>
    </div>
  </div>
</div>

<script>
const slug = "{{ slug }}";

async function loadGame() {
  const res = await api(`/api/games/${slug}`);
  
  // Update visual with category gradient
  const visual = document.getElementById('game-visual');
  visual.className = `game-hero-visual poster-cover ${res.category || ''}`;
  
  const info = document.getElementById('game-info');
  info.innerHTML = `
    <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem;">
      <span class="chip chip-accent">${res.category}</span>
      <span style="color:var(--success); font-size:0.7rem; font-weight:700;">✦ INCLUDED WITH SUBSCRIPTION</span>
    </div>
    <div class="title">${res.title}</div>
    <div class="desc">${res.description}</div>
    <div class="specs" style="margin-top:1.5rem;">
      <div class="spec-item"><div class="label">Difficulty</div><div class="val">${'⭐'.repeat(res.difficulty) || '⭐'}</div></div>
      <div class="spec-item"><div class="label">Weight Range</div><div class="val">${res.min_weight} - ${res.max_weight} lb</div></div>
      <div class="spec-item"><div class="label">Exercise Mode</div><div class="val">${res.default_mode}</div></div>
      <div class="spec-item"><div class="label">Rating</div><div class="val">${(res.rating || 0).toFixed(1)} <span style="font-weight:400; color:var(--ink-dim);">(${res.reviews_count || 0})</span></div></div>
    </div>
    <div class="game-actions">
      <button class="btn btn-primary" style="font-size:1.1rem; padding:0.9rem 2.5rem;" onclick="playGame('${res.slug}', '${res.title}')"><span style="font-size:1.3rem;">▶</span> Play Now</button>
    </div>
  `;

  // Reviews
  const reviewsList = document.getElementById('reviews-list');
  const reviewCount = document.getElementById('review-count');
  if (res.reviews && res.reviews.length) {
    reviewCount.textContent = `${res.reviews.length} review${res.reviews.length !== 1 ? 's' : ''}`;
    reviewsList.innerHTML = res.reviews.map(r => `
      <div class="review-card">
        <div class="author">${r.reviewer_name || 'Anonymous'} <span class="review-stars">${'⭐'.repeat(r.rating) || '⭐'}</span></div>
        <div class="review-text">${r.comment || 'No comment'}</div>
        <div class="review-date">${new Date(r.created_at).toLocaleDateString()}</div>
      </div>
    `).join('');
  } else {
    reviewCount.textContent = 'No reviews yet';
    reviewsList.innerHTML = '<p style="color:var(--ink-dim);">No reviews yet. Be the first!</p>';
  }

  if (tok) {
    document.getElementById('review-form').style.display = 'block';
  }
}

function playGame(slug, title) {
  toast(`Launching ${title}... connect your Go-Tone device!`, 'success');
}

async function submitReview() {
  if (!tok) { toast('Login to review', 'error'); return; }
  const rating = parseInt(document.getElementById('rating').value);
  const comment = document.getElementById('comment').value;
  await api(`/api/games/${slug}/reviews`, { method: 'POST', body: JSON.stringify({ rating, comment }) });
  toast('Review submitted!');
  document.getElementById('comment').value = '';
  loadGame();
}

loadGame();
</script>
{% endblock %}
